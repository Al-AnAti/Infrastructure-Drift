version: '3.8'
name: infrastructure-test

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    labels:
      - "warden.managed=true"
      - "warden.repo=my-cs-project"
  cache:
    image: redis:alpine
    ports:
      - "6378:6378"
    labels:
      - "warden.managed=false"
      - "warden.repo=not-my-cs-project"
  rogue-db:
    image: mariadb:latest
    ports:
      - "3306:3306"
    environment:
      - MARIADB_ROOT_PASSWORD=${MARIADB_ROOT_PASSWORD}
