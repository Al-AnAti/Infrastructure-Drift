# docker-compose.test.yml
version: '3.8'
name: infrastructure-test

services:
  web:
    image: nginx:alpine
    ports:
      - "8080:80"
    labels:
      - "sentinel.managed=true"
      - "sentinel.repo=my-cs-project"
  cache:
    image: redis:latest
    ports:
      - "6378:6378"
    labels:
      - "warden.managed=true"
      - "warden.repo=my-cs-project"
